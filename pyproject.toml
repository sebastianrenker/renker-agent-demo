[project]
name = "renker-agent-demo"
version = "0.1.0"
description = "Runnable demo: renker-core-authz secures an AI agent's tool calls against prompt injection."
requires-python = ">=3.11"
dependencies = [
    "renker-core-authz @ git+https://github.com/sebastianrenker/renker-core-authz.git",
]

[project.optional-dependencies]
# Pinned to the v1 FastMCP API this server targets; mcp 2.x renamed FastMCP to MCPServer.
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
renker-agent-demo = "renker_agent_demo.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
